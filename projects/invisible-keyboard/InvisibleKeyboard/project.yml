name: InvisibleKeyboard
options:
  bundleIdPrefix: com.hssnd
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  InvisibleKeyboard:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hssnd.invisiblekeyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Invisible Keyboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: InvisibleKeyboardExtension
        embed: true
  InvisibleKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
    info:
      path: Keyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hssnd.invisiblekeyboard.extension
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
